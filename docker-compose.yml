services:
  docling:
    profiles: ["document-pilot"]
    image: ghcr.io/docling-project/docling-serve-cpu@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    entrypoint: ["/opt/app-root/bin/python", "/worker.py"]
    volumes:
      - ./docker/document-pilot/worker.py:/worker.py:ro
      # OCR bahasa Indonesia (tessdata_fast, cocok untuk Tesseract 4.1 di image ini).
      - ./docker/document-pilot/tessdata/ind.traineddata:/usr/share/tesseract/tessdata/ind.traineddata:ro
    environment:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    cpus: 1.5
    mem_limit: 2350m
    networks: [document_pilot]
    restart: unless-stopped

  ppt-converter:
    profiles: ["document-pilot"]
    build: ./docker/document-pilot
    cpus: 1
    mem_limit: 512m
    networks: [document_pilot]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: normchat-nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    ports:
      - "127.0.0.1:8082:80"
    # Ikut jaringan `edge` agar Caddy edge (uno-edge-caddy-1) bisa mem-proxy https://normi.chat ke sini.
    networks:
      - default
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  app:
    networks: [default, document_pilot]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normchat-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - normchat_storage:/opt/normchat/storage
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      MARKETING_URL: ${MARKETING_URL}
      NORMCHAT_APP_URL: ${NORMCHAT_APP_URL}
      NORMCHAT_MARKETING_PATH: ${NORMCHAT_MARKETING_PATH}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      CACHE_STORE: ${CACHE_STORE}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_QUEUE: ${REDIS_QUEUE}
      REDIS_QUEUE_CONNECTION: ${REDIS_QUEUE_CONNECTION}
      NORMCHAT_STORAGE_ROOT: ${NORMCHAT_STORAGE_ROOT}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT}
      REVERB_SCHEME: ${REVERB_SCHEME}
      REVERB_SERVER_HOST: ${REVERB_SERVER_HOST}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT}
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
      INTERDOTZ_CLIENT_ID: ${INTERDOTZ_CLIENT_ID}
      INTERDOTZ_CLIENT_SECRET: ${INTERDOTZ_CLIENT_SECRET}
      INTERDOTZ_API_BASE: ${INTERDOTZ_API_BASE}
      INTERDOTZ_SSO_BASE: ${INTERDOTZ_SSO_BASE}
      INTERDOTZ_REDIRECT_URI: ${INTERDOTZ_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /opt/normchat/storage/attachments /opt/normchat/storage/exports /opt/normchat/storage/backups &&
        chown -R www-data:www-data /opt/normchat/storage &&
        chmod -R ug+rwX /opt/normchat/storage &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan view:cache &&
        php artisan storage:link --force 2>/dev/null || true &&
        php-fpm
      "

  queue:
    networks: [default, document_pilot]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normchat-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - normchat_storage:/opt/normchat/storage
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER}
      CACHE_STORE: ${CACHE_STORE}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_QUEUE: ${REDIS_QUEUE}
      REDIS_QUEUE_CONNECTION: ${REDIS_QUEUE_CONNECTION}
      NORMCHAT_STORAGE_ROOT: ${NORMCHAT_STORAGE_ROOT}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT}
      REVERB_SCHEME: ${REVERB_SCHEME}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
      INTERDOTZ_CLIENT_ID: ${INTERDOTZ_CLIENT_ID}
      INTERDOTZ_CLIENT_SECRET: ${INTERDOTZ_CLIENT_SECRET}
      INTERDOTZ_API_BASE: ${INTERDOTZ_API_BASE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Orkestrator antrean: Horizon menjalankan supervisor per antrean (config/horizon.php,
    # docs/rancangan-worker-dan-file-nov.md). Saat container dihentikan, Horizon menunggu job yang sedang
    # berjalan; 3 menit cukup untuk hampir semua jawaban Normi. Kode baru dimuat dengan
    # `php artisan horizon:terminate` (container keluar lalu dinyalakan ulang Docker).
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    # Worker berjalan sebagai www-data seperti PHP-FPM. Bila root, folder lampiran baru (mode 0700)
    # tidak bisa dibaca FPM sehingga gambar/canvas AI 404 sampai worker restart dan chown berjalan.
    # memory_limit ditulis ke conf.d agar ikut ke proses worker anak yang dibuat Horizon.
    command: >
      sh -c "
        mkdir -p /opt/normchat/storage/attachments /opt/normchat/storage/exports /opt/normchat/storage/backups &&
        chown -R www-data:www-data /opt/normchat/storage &&
        chmod -R ug+rwX /opt/normchat/storage &&
        echo memory_limit=384M > /usr/local/etc/php/conf.d/zz-worker-memory.ini &&
        exec setpriv --reuid=www-data --regid=www-data --init-groups php artisan horizon
      "

  # Tugas terjadwal (routes/console.php): cadangan chat otomatis pukul 03.00, hapus cadangan
  # lebih dari 30 hari dan unduhan riwayat lebih dari 7 hari. Konfigurasi dibaca dari .env.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normchat-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - normchat_storage:/opt/normchat/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: setpriv --reuid=www-data --regid=www-data --init-groups php artisan schedule:work

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normchat-reverb
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - normchat_storage:/opt/normchat/storage
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER}
      CACHE_STORE: ${CACHE_STORE}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NORMCHAT_STORAGE_ROOT: ${NORMCHAT_STORAGE_ROOT}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT}
      REVERB_SCHEME: ${REVERB_SCHEME}
      REVERB_SERVER_HOST: ${REVERB_SERVER_HOST}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /opt/normchat/storage/attachments /opt/normchat/storage/exports /opt/normchat/storage/backups &&
        chown -R www-data:www-data /opt/normchat/storage &&
        chmod -R ug+rwX /opt/normchat/storage &&
        php artisan reverb:start --host=0.0.0.0 --port=8080
      "

  postgres:
    # postgres:16-alpine + pgvector (docker/postgres/Dockerfile); data volume tetap sama.
    build:
      context: ./docker/postgres
    image: normchat-postgres:16-pgvector
    container_name: normchat-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normchat -d normchat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: normchat-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Password diambil dari .env yang sama dengan aplikasi; kosong = tanpa AUTH.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  document_pilot:
    internal: true
  # Dibuat oleh stack Caddy edge Unocoffee, bukan oleh compose ini.
  edge:
    external: true

volumes:
  postgres_data:
  redis_data:
  normchat_storage:
